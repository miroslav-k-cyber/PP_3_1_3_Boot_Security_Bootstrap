<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>User page</title>
    <!-- Подключение CSS Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- 1. Верхняя темная шапка (Navbar) -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid px-4">
        <span class="navbar-brand text-secondary">
            <!-- Выводим почту текущего пользователя -->
            <strong class="text-white" th:text="${currentUser.email}">user@mail.ru</strong>
            <!-- Динамически выводим роли через запятую без префикса ROLE_ -->
            <span class="text-secondary">with roles:
                <span th:each="role, iterStat : ${currentUser.roles}"
                      th:text="${role.name.replace('ROLE_', '')} + ${!iterStat.last ? ', ' : ''}"></span>
            </span>
        </span>
        <!-- Кнопка Logout -->
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-link text-white-50 text-decoration-none p-0">Logout</button>
        </form>
    </div>
</nav>

<!-- 2. Главный контейнер (Сетка) -->
<div class="container-fluid mt-3">
    <div class="row">

        <!-- Левая панель навигации -->
        <div class="col-md-2 px-0 bg-white">
            <div class="nav flex-column nav-pills" role="tablist">
                <a class="nav-link rounded-0 py-2 px-4 w-100 active" href="/user">User</a>
            </div>
        </div>

        <!-- Правая рабочая зона -->
        <div class="col-md-10 px-4">
            <h1 class="mb-3 fw-medium text-dark">User information-page</h1>

            <!-- Блок-карточка (Card) "About user" -->
            <div class="card mt-3">
                <div class="card-header bg-light border-bottom py-2">
                    <h5 class="mb-0 text-dark fw-medium">About user</h5>
                </div>
                <div class="card-body p-4">
                    <!-- Адаптивная таблица с эффектом зебры -->
                    <table class="table table-striped table-hover align-middle border-top">
                        <thead>
                        <tr>
                            <th class="fw-bold">ID</th>
                            <th class="fw-bold">First Name</th>
                            <th class="fw-bold">Last Name</th>
                            <th class="fw-bold">Age</th>
                            <th class="fw-bold">Email</th>
                            <th class="fw-bold">Role</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <!-- Серверный вывод текущего пользователя -->
                            <td th:text="${currentUser.id}"></td>
                            <td th:text="${currentUser.firstName}"></td>
                            <td th:text="${currentUser.lastName}"></td>
                            <td th:text="${currentUser.age}"></td>
                            <td th:text="${currentUser.email}"></td>
                            <td>
                                <span th:each="role, iterStat : ${currentUser.roles}"
                                      th:text="${role.name.replace('ROLE_', '')} + ${!iterStat.last ? ', ' : ''}"></span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Подключение JS Bootstrap 5 (нужен для работы некоторых компонентов, оставляем для порядка) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- ВАЖНО: Скрипт admin.js здесь НЕ НУЖЕН, поэтому мы его убрали -->
</body>
</html>
